name: PrepPilot AI CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
          npm --prefix client ci

      - name: Client TypeScript Verification & Build
        run: |
          npm --prefix client run build

      - name: Backend Security & Reliability Test Suite
        run: |
          npm --prefix server test
