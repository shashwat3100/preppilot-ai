<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/svg+xml" href="./client/dist/favicon.svg" />
  <title>PrepPilot AI – Launching...</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 1.5rem;
      box-sizing: border-box;
    }
    .launcher-card {
      background: #10192b;
      border: 1px solid #1e293b;
      border-radius: 1.25rem;
      padding: 2.5rem 2rem;
      text-align: center;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3.5px solid rgba(99, 102, 241, 0.2);
      border-top-color: #6366f1;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 1.25rem;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h2 {
      font-size: 1.25rem;
      font-weight: 800;
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: #94a3b8;
      font-size: 0.875rem;
      margin: 0 0 1.25rem;
      line-height: 1.5;
    }
    a {
      color: #818cf8;
      text-decoration: none;
      font-weight: 600;
      font-size: 0.825rem;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
  <script>
    (function() {
      var hash = window.location.hash || '';
      // Seamlessly redirect into the compiled SPA distribution
      var target = './client/dist/index.html' + hash;
      window.location.replace(target);
    })();
  </script>
</head>
<body>
  <div class="launcher-card">
    <div class="spinner"></div>
    <h2>Launching PrepPilot AI</h2>
    <p>Loading the application through your local live server...</p>
    <div>
      <a href="./client/dist/index.html">Click here if not redirected automatically</a>
    </div>
  </div>
</body>
</html>
